<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問卷分派中</title>
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      text-align: center;
      padding: 80px 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <p id="status">系統正在分派，請稍候……</p>

  <script>
    let completed = false;

    function receiveAssignment(result) {
      if (completed) return;
      completed = true;

      if (result && result.url) {
        window.location.replace(result.url);
      } else {
        document.getElementById("status").textContent =
          "系統暫時無法完成分派，請重新整理頁面再試一次。";
      }
    }

    const script = document.createElement("script");
    script.src =
      "https://script.google.com/macros/s/AKfycbx4HZqdjlViGlQ3jzC4mGK0EYzcny17JVXxn_9C7TdOkDLMOhPCpBIl4PKU4HP7DbpUDw/exec"
      + "?callback=receiveAssignment"
      + "&t=" + Date.now();

    script.onerror = function() {
      if (completed) return;
      completed = true;
      document.getElementById("status").textContent =
        "連線失敗，請重新整理頁面再試一次。";
    };

    document.body.appendChild(script);

    setTimeout(function() {
      if (!completed) {
        completed = true;
        document.getElementById("status").textContent =
          "系統回應較久，請重新整理頁面再試一次。";
      }
    }, 12000);
  </script>
</body>
</html>
